<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Arzamas AR - Streltsy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .arjs-loader {
      height: 100%; width: 100%; position: absolute; top: 0; left: 0;
      background-color: rgba(0,0,0,0.8); z-index: 9999;
      display: flex; justify-content: center; align-items: center;
    }
    .arjs-loader div { text-align: center; font-size: 1.1em; color: white; font-family: sans-serif; padding: 20px; }
    #info-text {
      position: fixed; bottom: 20px; left: 0; right: 0; text-align: center;
      color: white; font-family: sans-serif; font-size: 14px;
      background: rgba(0,0,0,0.5); padding: 10px; z-index: 999;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">
  <div class="arjs-loader">
    <div>Загрузка AR... Разрешите доступ к камере</div>
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; smoothCount: 10; smoothTolerance: 0.01; smoothThreshold: 5;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: false; colorManagement: true; alpha: true;"
  >
    <a-assets>
      <img id="warriorTex" src="assets/streltsy.png?v=4" crossorigin="anonymous">
    </a-assets>

    <a-marker preset="hiro" id="marker" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
      <a-plane
        id="warrior"
        src="#warriorTex"
        width="1.2"
        height="1.8"
        position="0 0.9 0"
        rotation="-90 0 0"
        material="transparent: true; alphaTest: 0.5; shader: flat; side: double; opacity: 1"
      ></a-plane>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <div id="info-text">Наведите камеру на маркер Hiro</div>

  <script>
    document.querySelector('a-scene').addEventListener('loaded', function () {
      document.querySelector('.arjs-loader').style.display = 'none';
    });
  </script>
</body>
</html>
