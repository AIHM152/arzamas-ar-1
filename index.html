<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Arzamas AR — Стрелец и Иван IV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin:0; overflow:hidden; }
    .arjs-loader { height:100%; width:100%; position:fixed; inset:0; background:rgba(0,0,0,.82); z-index:9999; display:flex; align-items:center; justify-content:center; }
    .arjs-loader div { color:#fff; font:16px sans-serif; text-align:center; padding:20px; }
    #info-text { position:fixed; bottom:20px; left:0; right:0; z-index:999; text-align:center; color:#fff; font:14px sans-serif; background:rgba(0,0,0,.5); padding:10px; }
  </style>
</head>
<body>
  <div class="arjs-loader"><div>Загрузка AR…<br>Разрешите доступ к камере</div></div>
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; smoothCount: 10; smoothTolerance: 0.01; smoothThreshold: 5;" vr-mode-ui="enabled:false" renderer="logarithmicDepthBuffer:false; colorManagement:true; alpha:true;">
    <a-assets>
      <img id="streltsyTex" src="assets/streltsy.png?v=4" crossorigin="anonymous">
      <img id="groznyTex" src="assets/grozny.png?v=4" crossorigin="anonymous">
    </a-assets>

    <!-- AR1: Стрелец, id=1 -->
    <a-marker type="barcode" value="1" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
      <a-plane src="#streltsyTex" width="1.2" height="1.8" position="0 0.9 0" rotation="-90 0 0" material="transparent:true; alphaTest:0.1; shader:flat; side:double"></a-plane>
    </a-marker>

    <!-- AR2: Иван IV, id=21 (визуально далёкий код от id=1, распознаётся независимо) -->
    <a-marker type="barcode" value="21" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
      <a-plane src="#groznyTex" width="1.2" height="1.8" position="0 0.9 0" rotation="-90 0 0" material="transparent:true; alphaTest:0.1; shader:flat; side:double"></a-plane>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
  <div id="info-text">Метка AR1 — Стрелец · Метка AR2 — Иван Грозный</div>
  <script>document.querySelector('a-scene').addEventListener('loaded',()=>document.querySelector('.arjs-loader').style.display='none');</script>
</body>
</html>
