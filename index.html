<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Исторический AR</title>

<!--
  ВАЖНО: этот перехват должен быть объявлен ДО загрузки AR.js,
  чтобы к моменту, когда AR.js сам вызовет getUserMedia() для
  включения камеры, наш патч уже был на месте.

  Идея универсальная (не привязана к конкретной модели телефона):
  мы подменяем стандартную функцию navigator.mediaDevices.getUserMedia
  так, что к ЛЮБОМУ запросу видео с камеры (от кого угодно на странице)
  автоматически добавляется пожелание "zoom: ideal 1". Если телефон/
  браузер поддерживает управление зумом камеры — она включится сразу
  на 1x, без ручного сброса постфактум. Если не поддерживает —
  параметр просто безопасно игнорируется, ничего не ломается.

  Это должно работать одинаково на любых Android-телефонах с
  несколькими объективами задней камеры (Xiaomi, Samsung, Pixel и т.д.),
  без необходимости прописывать что-то под конкретную модель.
-->
<script>
  (function patchGetUserMedia() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    var original = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
    navigator.mediaDevices.getUserMedia = function (constraints) {
      try {
        if (constraints && constraints.video) {
          if (typeof constraints.video !== 'object') {
            constraints.video = { facingMode: constraints.video };
          }
          constraints.video.zoom = { ideal: 1 };
        }
      } catch (e) { /* безопасно игнорируем, если структура constraints другая */ }
      return original(constraints);
    };
  })();
</script>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  html, body { margin: 0; overflow: hidden; height: 100%; font-family: system-ui, sans-serif; }

  video, canvas {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
  }

  .hint{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;background:rgba(0,0,0,.7);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;white-space:nowrap;pointer-events:none}
  .dbg{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:10;background:rgba(0,0,0,.65);color:#0f0;font:12px monospace;padding:6px 10px;border-radius:8px;display:none;max-width:90vw;white-space:pre-wrap}
</style>
</head>
<body>
  <div class="hint">Наведите камеру на метку AR1–AR13</div>
  <div class="dbg" id="dbg"></div>

  <!--
    Дополнительный (запасной) фикс: даже если начальный zoom-констрейнт
    выше не подхватился сразу, эта функция ждёт, пока видеотрек станет
    "live", и повторно принудительно ставит минимальный zoom, если
    камера поддерживает такой constraint. Работает как страховка —
    универсально, без привязки к конкретной модели телефона.
  -->
  <script>
    var DEBUG = new URLSearchParams(location.search).get('debug') === '1';
    if (DEBUG) document.querySelector('#dbg').style.display = 'block';

    function log(msg) {
      if (DEBUG) {
        var el = document.querySelector('#dbg');
        el.textContent = msg + '\n' + el.textContent;
      }
      console.log(msg);
    }

    (function forceMinZoom() {
      var tries = 0;
      var maxTries = 60;

      var interval = setInterval(function () {
        tries++;
        var video = document.querySelector('video');
        var track = video && video.srcObject && video.srcObject.getVideoTracks
          ? video.srcObject.getVideoTracks()[0]
          : null;

        if (!track || track.readyState !== 'live') {
          if (tries >= maxTries) clearInterval(interval);
          return;
        }

        var settings = track.getSettings ? track.getSettings() : {};
        var caps = track.getCapabilities ? track.getCapabilities() : {};
        log('Разрешение: ' + settings.width + 'x' + settings.height + ' | текущий zoom: ' + settings.zoom);

        if (!caps.zoom) {
          log('Камера не сообщает поддержку zoom-constraint (попытка ' + tries + ')');
          if (tries >= maxTries) clearInterval(interval);
          return;
        }

        var target = caps.zoom.min;
        track.applyConstraints({ advanced: [{ zoom: target }] })
          .then(function () {
            log('Zoom установлен на ' + target + ' (диапазон ' + caps.zoom.min + '-' + caps.zoom.max + ')');
          })
          .catch(function (e) {
            log('Ошибка applyConstraints zoom: ' + e.message);
          });

        if (tries >= maxTries) clearInterval(interval);
      }, 500);
    })();

    AFRAME.registerComponent('distance-scale', {
      schema: {
        reference: { type: 'number', default: 0.35 },
        power: { type: 'number', default: 1.6 },
        min: { type: 'number', default: 0.5 },
        max: { type: 'number', default: 4 }
      },
      init: function () {
        this.camPos = new THREE.Vector3();
        this.objPos = new THREE.Vector3();
      },
      tick: function () {
        var camera = this.el.sceneEl.camera;
        if (!camera) return;
        camera.getWorldPosition(this.camPos);
        this.el.object3D.getWorldPosition(this.objPos);
        var dist = this.camPos.distanceTo(this.objPos);
        var scale = Math.pow(dist / this.data.reference, this.data.power);
        scale = Math.min(this.data.max, Math.max(this.data.min, scale));
        this.el.object3D.scale.set(scale, scale, scale);
      }
    });
  </script>
