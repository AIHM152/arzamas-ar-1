<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>AR</title>

<!--
  Изменение относительно предыдущей версии: добавлен параметр
  aspectRatio, который просит камеру обрезать кадр под РЕАЛЬНУЮ
  пропорцию экрана конкретного телефона (считается динамически из
  window.innerWidth/innerHeight — работает одинаково корректно и на
  "обычных" телефонах, и на новых с очень высоким разрешением экрана).

  Раньше запрашивали просто width/height без aspectRatio — камера
  всё равно отдавала стандартный 16:9 (например, 1280x720), а экран
  телефона гораздо уже (примерно 9:19.5) — отсюда оставался
  остаточный зум ~x2 при заполнении экрана. aspectRatio должен
  уменьшить это расхождение.

  Высота кадра (1280) выбрана умеренной ради производительности —
  AR.js в реальном времени анализирует каждый кадр на поиск метки,
  и слишком высокое разрешение может тормозить слабые телефоны
  на выставке.
-->
<script>
  (function patchGetUserMedia() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    var original = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
    navigator.mediaDevices.getUserMedia = function (constraints) {
      try {
        if (constraints && constraints.video) {
          if (typeof constraints.video !== 'object') {
            constraints.video = { facingMode: constraints.video };
          }
          var ar = window.innerWidth / window.innerHeight; // например 0.45 для высокого экрана
          var targetHeight = 1280;
          var targetWidth = Math.round(targetHeight * ar);

          constraints.video.aspectRatio = { ideal: ar };
          constraints.video.width = { ideal: targetWidth };
          constraints.video.height = { ideal: targetHeight };
        }
      } catch (e) { /* безопасно игнорируем */ }
      return original(constraints);
    };
  })();
</script>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  body{margin:0;overflow:hidden;font-family:system-ui,sans-serif}
  .hint{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;background:rgba(0,0,0,.7);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;white-space:nowrap;pointer-events:none}
  .dbg{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:10;background:rgba(0,0,0,.65);color:#0f0;font:12px monospace;padding:6px 10px;border-radius:8px;display:none;max-width:90vw;white-space:pre-wrap}
</style>
</head>
<body>
  <div class="hint">Наведите камеру на метку AR1–AR13</div>
  <div class="dbg" id="dbg"></div>

  <!--
    Barcode-метки ARToolKit (matrixCodeType: 3x3).
    distance-scale масштабирует картинку по расстоянию до метки
    (scale = clamp((dist/reference)^power, min, max), reference=0.35 —
    35 см, power=1.6). debug-режим включается через ?debug=1.

    value=1  -> AR1  -> assets/01-grozny.png
    value=2  -> AR2  -> assets/02-streltsy.png
    value=3  -> AR3  -> assets/03-krepost.png
    value=4  -> AR4  -> assets/04-vvedensky.png
    value=5  -> AR5  -> assets/05-shimonah.png
    value=6  -> AR6  -> assets/06-stupin.png
    value=7  -> AR7  -> assets/07-shkola.png
    value=8  -> AR8  -> assets/08-korinfsky.png
    value=9  -> AR9  -> assets/09-sobor.png
    value=10 -> AR10 -> assets/10-sogan.png
    value=11 -> AR11 -> assets/11-sadik.png
    value=12 -> AR12 -> assets/12-moskvin.png
    value=13 -> AR13 -> assets/13-muzey.png
  -->

  <script>
    var DEBUG = new URLSearchParams(location.search).get('debug') === '1';
    if (DEBUG) document.querySelector('#dbg').style.display = 'block';

    (function reportActualStream() {
      var tries = 0;
      var maxTries = 20;
      var interval = setInterval(function () {
        tries++;
        var video = document.querySelector('video');
        var track = video && video.srcObject && video.srcObject.getVideoTracks
          ? video.srcObject.getVideoTracks()[0]
          : null;
        if (track && track.readyState === 'live') {
          var s = track.getSettings ? track.getSettings() : {};
          if (DEBUG) {
            document.querySelector('#dbg').textContent =
              'Поток камеры: ' + s.width + 'x' + s.height + ' | aspectRatio: ' + (s.aspectRatio ? s.aspectRatio.toFixed(3) : '?') +
              '\nЭкран: ' + window.innerWidth + 'x' + window.innerHeight + ' | aspectRatio: ' + (window.innerWidth / window.innerHeight).toFixed(3);
          }
          clearInterval(interval);
        } else if (tries >= maxTries) {
          clearInterval(interval);
        }
      }, 500);
    })();

    AFRAME.registerComponent('distance-scale', {
      schema: {
        reference: { type: 'number', default: 0.35 },
        power: { type: 'number', default: 1.6 },
        min: { type: 'number', default: 0.5 },
        max: { type: 'number', default: 4 }
      },
      init: function () {
        this.camPos = new THREE.Vector3();
        this.objPos = new THREE.Vector3();
      },
      tick: function () {
        var camera = this.el.sceneEl.camera;
        if (!camera) return;
        camera.getWorldPosition(this.camPos);
        this.el.object3D.getWorldPosition(this.objPos);
        var dist = this.camPos.distanceTo(this.objPos);
        var scale = Math.pow(dist / this.data.reference, this.data.power);
        scale = Math.min(this.data.max, Math.max(this.data.min, scale));
        this.el.object3D.scale.set(scale, scale, scale);
      }
    });
  </script>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true; alpha: true;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best;">

    <a-assets timeout="15000">
      <img id="grozny" src="assets/01-grozny.png" crossorigin="anonymous">
      <img id="streltsy" src="assets/02-streltsy.png" crossorigin="anonymous">
      <img id="krepost" src="assets/03-krepost.png" crossorigin="anonymous">
      <img id="vvedensky" src="assets/04-vvedensky.png" crossorigin="anonymous">
      <img id="shimonah" src="assets/05-shimonah.png" crossorigin="anonymous">
      <img id="stupin" src="assets/06-stupin.png" crossorigin="anonymous">
      <img id="shkola" src="assets/07-shkola.png" crossorigin="anonymous">
      <img id="korinfsky" src="assets/08-korinfsky.png" crossorigin="anonymous">
      <img id="sobor" src="assets/09-sobor.png" crossorigin="anonymous">
      <img id="sogan" src="assets/10-sogan.png" crossorigin="anonymous">
      <img id="sadik" src="assets/11-sadik.png" crossorigin="anonymous">
      <img id="moskvin" src="assets/12-moskvin.png" crossorigin="anonymous">
      <img id="muzey" src="assets/13-muzey.png" crossorigin="anonymous">
    </a-assets>

    <a-marker type="barcode" value="1" smooth="true" smooth-count="25" smooth-tolerance="0.003" smooth-threshold="10">
      <a-image src="#grozny" distance-scale position="0 1.7 0" rotation="-90 0 0" width="2.2" height="3.3" transparent="true" material="shader: flat; transparent: true; side: double"></a-image>
    </a-marker>
    <a-marker type="barcode" value="2" smooth="true" smooth-count="25" smooth-tolerance="0.003" smooth-threshold="10">
      <a-image src="#streltsy" distance-scale position="0 1.7 0" rotation="-90 0 0" width="2.2" height="3.3" transparent="true" material="shader: flat; transparent: true; side: double"></a-image>
    </a-marker>
    <a-marker type="barcode" value="3" smooth="true" smooth-count="25" smooth-tolerance="0.003" smooth-threshold="10">
      <a-image src="#krepost" distance-scale position="0 1.0 0" rotation="-90 0 0" width="2.8" height="2.1" transparent="true" material="shader: flat; transparent: true; side: double"></a-image>
    </a-marker>
    <a-marker type="barcode" value="4" smooth="true" smooth-count="25" smooth-tolerance="0.003" smooth-threshold="10">
      <a-image src="#vvedensky" distance-scale position="0 1.0 0" rotation="-90 0 0" width="2.8" height="2.1" transparent="true" material="shader: flat; transparent: true; side: double"></a-image>
    </a-marker>
    <a-marker type="barcode" value="5" smooth="true" smooth-count="25" smooth-tolerance="0.003" smooth-threshold="10">
      <a-image src="#shimonah" distance-scale position="0 1.7 0" rotation="-90 0 0" width="2.2" height="3.3" transparent="true" material="shader: flat; transparent: true; side: double"></a-image>
    </a-marker>
    <a-marker type="barcode" value="6" smooth="true" smooth-count="25" smooth-tolerance="0.003" smooth-threshold="10">
      <a-image src="#stupin" distance-scale position="0 2.0 0" rotation="-90 0 0" width="1.6" height="3.9" transparent="true" material="shader: flat; transparent: true; side: double"></a-image>
    </a-marker>
    <a-marker type="barcode" value="7" smooth="true" smooth-count="25" smooth-tolerance="0.003" smooth-threshold="10">
      <a-image src="#shkola" distance-scale position="0 1.0 0" rotation="-90 0 0" width="2.8" height="2.1" transparent="true" material="shader: flat; transparent: true; side: double"></a-image>
    </a-marker>
    <a-marker type="barcode" value="8" smooth="true" smooth-count="25" smooth-tolerance="0.003" smooth-threshold="10">
      <a-image src="#korinfsky" distance-scale position="0 1.7 0" rotation="-90 0 0" width="2.2" height="3.3" transparent="true" material="shader: flat; transparent: true; side: double"></a-image>
    </a-marker>
    <a-marker type="barcode" value="9" smooth="true" smooth-count="25" smooth-tolerance="0.003" smooth-threshold="10">
      <a-image src="#sobor" distance-scale position="0 1.0 0" rotation="-90 0 0" width="2.8" height="2.1" transparent="true" material="shader: flat; transparent: true; side: double"></a-image>
    </a-marker>
    <a-marker type="barcode" value="10" smooth="true" smooth-count="25" smooth-tolerance="0.003" smooth-threshold="10">
      <a-image src="#sogan" distance-scale position="0 1.0 0" rotation="-90 0 0" width="2.8" height="2.1" transparent="true" material="shader: flat; transparent: true; side: double"></a-image>
    </a-marker>
    <a-marker type="barcode" value="11" smooth="true" smooth-count="25" smooth-tolerance="0.003" smooth-threshold="10">
      <a-image src="#sadik" distance-scale position="0 1.6 0" rotation="-90 0 0" width="2.0" height="2.8" transparent="true" material="shader: flat; transparent: true; side: double"></a-image>
    </a-marker>
    <a-marker type="barcode" value="12" smooth="true" smooth-count="25" smooth-tolerance="0.003" smooth-threshold="10">
      <a-image src="#moskvin" distance-scale position="0 1.7 0" rotation="-90 0 0" width="2.2" height="3.3" transparent="true" material="shader: flat; transparent: true; side: double"></a-image>
    </a-marker>
    <a-marker type="barcode" value="13" smooth="true" smooth-count="25" smooth-tolerance="0.003" smooth-threshold="10">
      <a-image src="#muzey" distance-scale position="0 1.0 0" rotation="-90 0 0" width="2.8" height="2.1" transparent="true" material="shader: flat; transparent: true; side: double"></a-image>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
 </body>
</html>
