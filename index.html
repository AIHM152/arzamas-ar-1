<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Исторический AR</title>

<!--
  Подтверждено тестами: на некоторых Android-телефонах (Xiaomi 12,
  Xiaomi 15T) виртуальная "камера окружения", которую видит браузер,
  жёстко зафиксирована на разрешении ~1920x1760 (почти квадрат) —
  запрос другого width/height через getUserMedia игнорируется на
  уровне драйвера/HAL телефона. Значит управлять реальным разрешением
  камеры через JS на этих устройствах невозможно.

  Раз саму камеру подстроить не получается, решаем проблему на
  уровне отображения: object-fit: contain вместо cover — показываем
  ВЕСЬ кадр камеры целиком (без обрезки по краям), с чёрными полосами
  там, где пропорции не совпадают, вместо агрессивной обрезки/зума.
  Для сканирования метки это важнее, чем красивая картинка без полос.
-->
<script>
  (function patchGetUserMedia() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    var original = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
    navigator.mediaDevices.getUserMedia = function (constraints) {
      try {
        if (constraints && constraints.video) {
          if (typeof constraints.video !== 'object') {
            constraints.video = { facingMode: constraints.video };
          }
          constraints.video.width = { ideal: 720 };
          constraints.video.height = { ideal: 1280 };
          constraints.video.zoom = { ideal: 1 };
        }
      } catch (e) { /* безопасно игнорируем */ }
      return original(constraints);
    };
  })();
</script>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  html, body { margin: 0; overflow: hidden; height: 100%; background: #000; font-family: system-ui, sans-serif; }

  video, canvas {
    position: fixed !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: contain !important;
  }

  .hint{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;background:rgba(0,0,0,.7);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;white-space:nowrap;pointer-events:none}
  .dbg{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:10;background:rgba(0,0,0,.65);color:#0f0;font:12px monospace;padding:6px 10px;border-radius:8px;display:none;max-width:90vw;white-space:pre-wrap}
</style>
</head>
<body>
  <div class="hint">Наведите камеру на метку AR1–AR13</div>
  <div class="dbg" id="dbg"></div>

  <script>
    var DEBUG = new URLSearchParams(location.search).get('debug') === '1';
    if (DEBUG) document.querySelector('#dbg').style.display = 'block';

    function log(msg) {
      if (DEBUG) {
        var el = document.querySelector('#dbg');
        el.textContent = msg + '\n' + el.textContent;
      }
      console.log(msg);
    }

    (function reportActualStream() {
      var tries = 0;
      var maxTries = 20;
      var interval = setInterval(function () {
        tries++;
        var video = document.querySelector('video');
        var track = video && video.srcObject && video.srcObject.getVideoTracks
          ? video.srcObject.getVideoTracks()[0]
          : null;
        if (track && track.readyState === 'live') {
          var s = track.getSettings ? track.getSettings() : {};
          log('Реальный поток камеры: ' + s.width + 'x' + s.height + ' | zoom: ' + s.zoom);
          clearInterval(interval);
        } else if (tries >= maxTries) {
          clearInterval(interval);
        }
      }, 500);
    })();

    AFRAME.registerComponent('distance-scale', {
      schema: {
        reference: { type: 'number', default: 0.35 },
        power: { type: 'number', default: 1.6 },
        min: { type: 'number', default: 0.5 },
        max: { type: 'number', default: 4 }
      },
      init: function () {
        this.camPos = new THREE.Vector3();
        this.objPos = new THREE.Vector3();
      },
      tick: function () {
        var camera = this.el.sceneEl.camera;
        if (!camera) return;
        camera.getWorldPosition(this.camPos);
        this.el.object3D.getWorldPosition(this.objPos);
        var dist = this.camPos.distanceTo(this.objPos);
        var scale = Math.pow(dist / this.data.reference, this.data.power);
        scale = Math.min(this.data.max, Math.max(this.data.min, scale));
        this.el.object3D.scale.set(scale, scale, scale);
      }
    });
  </script>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best;">

    </a-marker>

    </a-marker>

    </a-marker>

    <a-entity camera></a-entity>
