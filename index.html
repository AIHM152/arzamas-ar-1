<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Arzamas AR - Streltsy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .arjs-loader div {
      text-align: center;
      font-size: 1.25em;
      color: white;
      font-family: sans-serif;
    }
    #info-text {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      font-family: sans-serif;
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      z-index: 999;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">
  <div class="arjs-loader">
    <div>Загрузка AR... Наведите камеру на маркер</div>
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
  >
    <a-assets>
      <img id="streltsy" src="./assets/streltsy.png" crossorigin="anonymous">
    </a-assets>

    <a-marker preset="hiro" id="marker">
      <a-entity
        id="warrior"
        geometry="primitive: plane; height: 2; width: 1.2"
        material="src: #streltsy; transparent: true; alphaTest: 0.5; shader: flat"
        position="0 1 0"
        rotation="-90 0 0"
        animation="property: position; to: 0 1.1 0; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine"
      ></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <div id="info-text">Наведите камеру на маркер, чтобы увидеть стрельца</div>

  <script>
    document.querySelector('a-scene').addEventListener('loaded', function () {
      document.querySelector('.arjs-loader').style.display = 'none';
    });
  </script>
</body>
</html>
