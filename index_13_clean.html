<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Arzamas AR - 13 objects (clean, no distance-scale, no camera patch)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  body { margin: 0; overflow: hidden; }
  .arjs-loader {
    height: 100%; width: 100%; position: fixed; inset: 0;
    background: rgba(0,0,0,.82); z-index: 9999;
    display: flex; align-items: center; justify-content: center;
  }
  .arjs-loader div { color: #fff; font: 16px sans-serif; text-align: center; padding: 20px; }
  #info-text {
    position: fixed; bottom: 20px; left: 0; right: 0; z-index: 999;
    text-align: center; color: #fff; font: 14px sans-serif;
    background: rgba(0,0,0,.5); padding: 10px;
  }
</style>
</head>
<body>
<div class="arjs-loader"><div>Загрузка AR...<br>Разрешите доступ к камере</div></div>

<a-scene embedded
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; smoothCount: 10; smoothTolerance: 0.01; smoothThreshold: 5;"
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: false; colorManagement: true; alpha: true">

  <a-assets>
    <img id="tex1" src="assets/grozny.png?v4" crossorigin="anonymous">
    <img id="tex2" src="assets/streltsy.png?v4" crossorigin="anonymous">
    <img id="tex3" src="assets/krepost.png?v4" crossorigin="anonymous">
    <img id="tex4" src="assets/vvedensky.png?v4" crossorigin="anonymous">
    <img id="tex5" src="assets/shimonah.png?v4" crossorigin="anonymous">
    <img id="tex6" src="assets/stupin.png?v4" crossorigin="anonymous">
    <img id="tex7" src="assets/shkola.png?v4" crossorigin="anonymous">
    <img id="tex8" src="assets/korinfsky.png?v4" crossorigin="anonymous">
    <img id="tex9" src="assets/sobor.png?v4" crossorigin="anonymous">
    <img id="tex10" src="assets/sogan.png?v4" crossorigin="anonymous">
    <img id="tex11" src="assets/sadik.png?v4" crossorigin="anonymous">
    <img id="tex12" src="assets/moskvin.png?v4" crossorigin="anonymous">
    <img id="tex13" src="assets/muzey.png?v4" crossorigin="anonymous">
  </a-assets>

  <!-- AR1, Иван Грозный -->
  <a-marker type="barcode" value="1" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
    <a-plane src="#tex1" width="2" height="3" position="0 1.5 0" rotation="-90 0 0"
      material="transparent: true; alphaTest: 0.1; shader: flat; side: double"></a-plane>
  </a-marker>

  <!-- AR2, Стрельцы -->
  <a-marker type="barcode" value="2" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
    <a-plane src="#tex2" width="2" height="3" position="0 1.5 0" rotation="-90 0 0"
      material="transparent: true; alphaTest: 0.1; shader: flat; side: double"></a-plane>
  </a-marker>

  <!-- AR3, Крепость -->
  <a-marker type="barcode" value="3" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
    <a-plane src="#tex3" width="2" height="3" position="0 1.5 0" rotation="-90 0 0"
      material="transparent: true; alphaTest: 0.1; shader: flat; side: double"></a-plane>
  </a-marker>

  <!-- AR4, Введенский собор -->
  <a-marker type="barcode" value="4" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
    <a-plane src="#tex4" width="2" height="3" position="0 1.5 0" rotation="-90 0 0"
      material="transparent: true; alphaTest: 0.1; shader: flat; side: double"></a-plane>
  </a-marker>

  <!-- AR5, Шимонах -->
  <a-marker type="barcode" value="5" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
    <a-plane src="#tex5" width="2" height="3" position="0 1.5 0" rotation="-90 0 0"
      material="transparent: true; alphaTest: 0.1; shader: flat; side: double"></a-plane>
  </a-marker>

  <!-- AR6, Ступин -->
  <a-marker type="barcode" value="6" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
    <a-plane src="#tex6" width="2" height="3" position="0 1.5 0" rotation="-90 0 0"
      material="transparent: true; alphaTest: 0.1; shader: flat; side: double"></a-plane>
  </a-marker>

  <!-- AR7, Школа -->
  <a-marker type="barcode" value="7" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
    <a-plane src="#tex7" width="2" height="3" position="0 1.5 0" rotation="-90 0 0"
      material="transparent: true; alphaTest: 0.1; shader: flat; side: double"></a-plane>
  </a-marker>

  <!-- AR8, Коринфский -->
  <a-marker type="barcode" value="8" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
    <a-plane src="#tex8" width="2" height="3" position="0 1.5 0" rotation="-90 0 0"
      material="transparent: true; alphaTest: 0.1; shader: flat; side: double"></a-plane>
  </a-marker>

  <!-- AR9, Собор -->
  <a-marker type="barcode" value="9" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
    <a-plane src="#tex9" width="2" height="3" position="0 1.5 0" rotation="-90 0 0"
      material="transparent: true; alphaTest: 0.1; shader: flat; side: double"></a-plane>
  </a-marker>

  <!-- AR10, Соган -->
  <a-marker type="barcode" value="10" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
    <a-plane src="#tex10" width="2" height="3" position="0 1.5 0" rotation="-90 0 0"
      material="transparent: true; alphaTest: 0.1; shader: flat; side: double"></a-plane>
  </a-marker>

  <!-- AR11, Садик -->
  <a-marker type="barcode" value="11" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
    <a-plane src="#tex11" width="2" height="3" position="0 1.5 0" rotation="-90 0 0"
      material="transparent: true; alphaTest: 0.1; shader: flat; side: double"></a-plane>
  </a-marker>

  <!-- AR12, Москвин -->
  <a-marker type="barcode" value="12" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
    <a-plane src="#tex12" width="2" height="3" position="0 1.5 0" rotation="-90 0 0"
      material="transparent: true; alphaTest: 0.1; shader: flat; side: double"></a-plane>
  </a-marker>

  <!-- AR13, Музей -->
  <a-marker type="barcode" value="13" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
    <a-plane src="#tex13" width="2" height="3" position="0 1.5 0" rotation="-90 0 0"
      material="transparent: true; alphaTest: 0.1; shader: flat; side: double"></a-plane>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<div id="info-text">AR1 / AR2 / AR3 / AR4 / AR5 / AR6 / AR7 / AR8 / AR9 / AR10 / AR11 / AR12 / AR13</div>

<script>
  document.querySelector('a-scene').addEventListener('loaded', function () {
    document.querySelector('.arjs-loader').style.display = 'none';
  });
</script>
</body>
</html>
